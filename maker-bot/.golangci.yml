version: "2"

linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funcorder
    - ireturn
    - mnd
    - nonamedreturns
    - revive
    - tagliatelle
    - varnamelen
    - depguard
    - wsl
    - gomodguard

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - experimental
        - opinionated
      disabled-checks:
        - whyNoLint

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

    paths:
      - _test.go

    rules:
      - linters:
          - err113
        text: "do not define dynamic errors"

      - linters:
          - lll
        source: "^//go:generate "

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports

  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - localmodule
        - alias

  exclusions:
    generated: disable

issues:
  max-same-issues: 0
  fix: true

output:
  formats:
    text:
      path: stdout

  sort-order:
    - linter
    - file

run:
  timeout: 5m
  relative-path-mode: gomod
  allow-parallel-runners: true
  allow-serial-runners: true
