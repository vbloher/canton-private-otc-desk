<!doctype html>
<html>
<body style="margin:0;padding:32px 16px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr><td align="center">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:8px">
<tr><td style="padding:32px">
<p style="margin:0 0 24px;font-size:13px;color:#71717a">Private OTC Desk</p>
<h1 style="margin:0 0 16px;font-size:20px;line-height:28px;font-weight:600">{{.Heading}}</h1>
{{range .Lines}}<p style="margin:0 0 12px;font-size:15px;line-height:22px">{{.}}</p>
{{end}}<p style="margin:24px 0 0"><a href="{{.ActionURL}}" style="display:inline-block;padding:10px 18px;background:#18181b;color:#ffffff;border-radius:6px;font-size:14px;text-decoration:none">{{.Action}}</a></p>
{{if .Footer}}<p style="margin:32px 0 0;font-size:12px;line-height:18px;color:#71717a">{{.Footer}} <a href="{{.ManageURL}}" style="color:#71717a">Manage notifications</a></p>
{{end}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
