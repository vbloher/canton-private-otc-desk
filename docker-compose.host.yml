# Linux override (`make up-all` adds it on Linux; CI uses it too). Containers on a Linux bridge
# cannot reach a sandbox that listens on the host's loopback, so the app containers share the
# host network instead and every one of them binds to 127.0.0.1 — nothing is exposed beyond
# this machine. Postgres and Redis stay on the bridge, published on loopback.
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build --wait

services:
  ledger:
    network_mode: host
    extra_hosts: !reset []
    environment:
      HTTP_HOST: 127.0.0.1
      GRPC_HOST: 127.0.0.1
      POSTGRES_HOST: 127.0.0.1
      REDIS_ADDR: 127.0.0.1:6379
      CANTON_URL: http://127.0.0.1:6864

  identity:
    network_mode: host
    extra_hosts: !reset []
    environment:
      HTTP_HOST: 127.0.0.1
      GRPC_HOST: 127.0.0.1
      POSTGRES_HOST: 127.0.0.1
      REDIS_ADDR: 127.0.0.1:6379
      LEDGER_GRPC_ADDR: 127.0.0.1:9083

  trading:
    network_mode: host
    extra_hosts: !reset []
    environment:
      HTTP_HOST: 127.0.0.1
      POSTGRES_HOST: 127.0.0.1
      REDIS_ADDR: 127.0.0.1:6379
      LEDGER_GRPC_ADDR: 127.0.0.1:9083
      IDENTITY_GRPC_ADDR: 127.0.0.1:9081

  gateway:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      HTTP_HOST: 127.0.0.1
      REDIS_ADDR: 127.0.0.1:6379
      IDENTITY_GRPC_ADDR: 127.0.0.1:9081
      IDENTITY_URL: http://127.0.0.1:8081
      TRADING_URL: http://127.0.0.1:8082
      LEDGER_URL: http://127.0.0.1:8083

  maker-bot:
    network_mode: host
    extra_hosts: !reset []
    environment:
      GATEWAY_URL: http://127.0.0.1:8080

  web:
    network_mode: host
    ports: !reset []
    environment:
      NGINX_HOST: 127.0.0.1
      NGINX_PORT: '3000'
      GATEWAY_UPSTREAM: 127.0.0.1:8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
