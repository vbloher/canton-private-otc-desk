syntax = "proto3";

package ledger_v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vbloher/canton-private-otc-desk/gen/grpc/ledger_v1";

service LedgerV1 {
  rpc ResolveParty(ResolvePartyInput) returns (ResolvePartyOutput);
  rpc GenerateExternalParty(GenerateExternalPartyInput) returns (GenerateExternalPartyOutput);
  rpc AllocateExternalParty(AllocateExternalPartyInput) returns (AllocateExternalPartyOutput);
  rpc GetDesk(GetDeskInput) returns (GetDeskOutput);
  rpc Allocate(AllocateInput) returns (AllocateOutput);
  rpc GetSettlements(GetSettlementsInput) returns (GetSettlementsOutput);
  rpc Settle(SettleInput) returns (SettleOutput);
  rpc CancelSettlement(CancelSettlementInput) returns (CancelSettlementOutput);
}

message ResolvePartyInput {
  string hint = 1;
}

message ResolvePartyOutput {
  string party_id = 1;
}

message GenerateExternalPartyInput {
  string hint = 1;
  bytes public_key = 2;
}

message GenerateExternalPartyOutput {
  string party_id = 1;
  string fingerprint = 2;
  bytes multi_hash = 3;
  repeated string topology_transactions = 4;
}

message AllocateExternalPartyInput {
  repeated string topology_transactions = 1;
  bytes signature = 2;
  string fingerprint = 3;
}

message AllocateExternalPartyOutput {
  string party_id = 1;
}

message Instrument {
  string symbol = 1;
  string name = 2;
  int32 decimals = 3;
}

message GetDeskInput {}

message GetDeskOutput {
  string operator_party_id = 1;
  repeated Instrument instruments = 2;
}

message TransferLeg {
  string id = 1;
  string sender = 2;
  string receiver = 3;
  string instrument = 4;
  string amount = 5;
}

message AllocateInput {
  string settlement_id = 1;
  google.protobuf.Timestamp deadline = 2;
  repeated TransferLeg legs = 3;
  string party_id = 4;
  string description = 5;
}

message AllocateOutput {
  bool executed = 1;
  repeated string action_ids = 2;
}

message SettlementQuery {
  string settlement_id = 1;
  repeated TransferLeg legs = 2;
}

message GetSettlementsInput {
  repeated SettlementQuery settlements = 1;
}

message PartyAllocation {
  string party_id = 1;
  bool allocated = 2;
}

message SettlementStatus {
  string settlement_id = 1;
  repeated PartyAllocation parties = 2;
}

message GetSettlementsOutput {
  repeated SettlementStatus settlements = 1;
}

message SettleInput {
  string settlement_id = 1;
  repeated TransferLeg legs = 2;
}

message SettleOutput {
  string update_id = 1;
}

message CancelSettlementInput {
  string settlement_id = 1;
}

message CancelSettlementOutput {
  int32 cancelled = 1;
}
