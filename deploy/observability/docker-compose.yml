name: observability

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  victoriametrics:
    <<: *logging
    image: victoriametrics/victoria-metrics:v1.155.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
    volumes:
      - vm-data:/storage
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8428/health']
      interval: 5s
      timeout: 3s
      retries: 30

  loki:
    <<: *logging
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo:
    <<: *logging
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/tempo.yml']
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  pyroscope:
    <<: *logging
    image: grafana/pyroscope:2.4.3
    restart: unless-stopped
    command:
      - -architecture.storage=v2
      - -retention-period=168h
      - -self-profiling.disable-push=true
      - -usage-stats.enabled=false
    volumes:
      - pyroscope-data:/data

  grafana:
    <<: *logging
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_METRICS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - victoriametrics
      - loki
      - tempo
      - pyroscope
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 60

networks:
  default:
    name: observability
    external: true

volumes:
  vm-data:
  loki-data:
  tempo-data:
  pyroscope-data:
  grafana-data:
