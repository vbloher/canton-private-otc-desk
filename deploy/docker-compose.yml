x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

x-go-service: &go-service
  <<: *logging
  restart: unless-stopped

x-common-env: &common-env
  LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
  OTEL_NAMESPACE: ${OTEL_NAMESPACE:-}
  OTEL_RATIO: ${OTEL_RATIO:-}
  PYROSCOPE_ENDPOINT: http://pyroscope-proxy:4040
  PYROSCOPE_ENV: ${DEPLOY_ENV}

x-db-env: &db-env
  <<: *common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: ${POSTGRES_USER:-otc}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REDIS_ADDR: redis:6379
  OTEL_ENDPOINT: otel-collector:4317

services:
  postgres:
    <<: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d ledger']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    <<: *logging
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

  kafka:
    <<: *logging
    image: apache/kafka:4.4.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9092']
      interval: 2s
      timeout: 5s
      retries: 30

  kafka-ui:
    <<: *logging
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    profiles: [kafka-ui]
    environment:
      KAFKA_CLUSTERS_0_NAME: ${DEPLOY_ENV}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: 'true'
      JAVA_OPTS: -Xmx256m
    ports:
      - '127.0.0.1:${KAFKA_UI_PORT:-8090}:8080'
    healthcheck:
      disable: true
    depends_on:
      kafka:
        condition: service_healthy

  ledger:
    <<: *go-service
    image: ${IMAGE_PREFIX}/ledger:${IMAGE_TAG}
    environment:
      <<: *db-env
      OTEL_SERVICE_NAME: ledger
      HTTP_PORT: '8083'
      GRPC_PORT: '9083'
      POSTGRES_DB_NAME: ledger
      CANTON_NETWORK: ${CANTON_NETWORK:?set CANTON_NETWORK in .env}
      CANTON_URL: ${CANTON_URL:?set CANTON_URL in .env}
      CANTON_USER_ID: ${CANTON_USER_ID:-}
      CANTON_AUTH_TOKEN_URL: ${CANTON_AUTH_TOKEN_URL:-}
      CANTON_AUTH_CLIENT_ID: ${CANTON_AUTH_CLIENT_ID:-}
      CANTON_AUTH_CLIENT_SECRET: ${CANTON_AUTH_CLIENT_SECRET:-}
      CANTON_AUTH_AUDIENCE: ${CANTON_AUTH_AUDIENCE:-}
      CANTON_AUTH_SCOPE: ${CANTON_AUTH_SCOPE:-}
      OPERATOR_PARTY: ${OPERATOR_PARTY:?set OPERATOR_PARTY in .env}
      INSTRUMENTS: ${INSTRUMENTS:?set INSTRUMENTS in .env}
      FAUCET_PARTY: ${FAUCET_PARTY:-}
      FAUCET_AMOUNTS: ${FAUCET_AMOUNTS:-}
      FAUCET_COOLDOWN: ${FAUCET_COOLDOWN:-}
      ACTION_TTL: ${ACTION_TTL:-}
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8083/ready']
      interval: 3s
      timeout: 3s
      retries: 60

  identity:
    <<: *go-service
    image: ${IMAGE_PREFIX}/identity:${IMAGE_TAG}
    environment:
      <<: *db-env
      OTEL_SERVICE_NAME: identity
      HTTP_PORT: '8081'
      GRPC_PORT: '9081'
      POSTGRES_DB_NAME: identity
      LEDGER_GRPC_ADDR: ledger:9083
      SESSION_TTL: ${SESSION_TTL:-}
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8081/ready']

  trading:
    <<: *go-service
    image: ${IMAGE_PREFIX}/trading:${IMAGE_TAG}
    environment:
      <<: *db-env
      OTEL_SERVICE_NAME: trading
      HTTP_PORT: '8082'
      POSTGRES_DB_NAME: trading
      LEDGER_GRPC_ADDR: ledger:9083
      IDENTITY_GRPC_ADDR: identity:9081
      KAFKA_BROKERS: kafka:9092
      FEE_BPS: ${FEE_BPS:-}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-}
      SETTLE_TIMEOUT: ${SETTLE_TIMEOUT:-}
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8082/ready']

  notification:
    <<: *go-service
    image: ${IMAGE_PREFIX}/notification:${IMAGE_TAG}
    environment:
      <<: *db-env
      OTEL_SERVICE_NAME: notification
      HTTP_PORT: '8084'
      POSTGRES_DB_NAME: notification
      KAFKA_BROKERS: kafka:9092
      PUBLIC_URL: ${PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_SEGMENT_ID: ${RESEND_SEGMENT_ID:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_INCLUDE_UPDATE_ID: ${EMAIL_INCLUDE_UPDATE_ID:-false}
      EMAIL_CONFIRMATIONS_DAILY_LIMIT: ${EMAIL_CONFIRMATIONS_DAILY_LIMIT:-}
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8084/ready']

  gateway:
    <<: *go-service
    image: ${IMAGE_PREFIX}/gateway:${IMAGE_TAG}
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: gateway
      OTEL_ENDPOINT: otel-collector:4317
      HTTP_PORT: '8080'
      REDIS_ADDR: redis:6379
      IDENTITY_GRPC_ADDR: identity:9081
      IDENTITY_URL: http://identity:8081
      TRADING_URL: http://trading:8082
      LEDGER_URL: http://ledger:8083
      NOTIFICATION_URL: http://notification:8084
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/ready']

  web:
    <<: *logging
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:80'
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    <<: *logging
    image: otel/opentelemetry-collector:0.165.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yml']
    environment:
      ENV: ${DEPLOY_ENV}
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    networks: [default, observability]

  pyroscope-proxy:
    <<: *logging
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./pyroscope-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, observability]

networks:
  observability:
    external: true

volumes:
  pg-data:
  redis-data:
  kafka-data:
