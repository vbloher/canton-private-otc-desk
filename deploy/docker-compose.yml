# The stack on a VPS, from the images release.yml publishes. Not for local use: see ../docker-compose.yml.
#
# The deploy job renders this file — the IMAGE_PREFIX and IMAGE_TAG placeholders become the registry path
# and the deployed version — and copies it to ~/otc-desk-<environment>/ on the server, with postgres/init.sql and
# .env.example. It never touches .env there: the settings are edited by hand on the server (start from
# .env.example). A docker-compose.override.yml next to it is picked up by docker compose and kept too.
#
# Only the web app is published, on 127.0.0.1:${WEB_PORT}: a reverse proxy on the host (Caddy) terminates
# TLS for the domain and forwards to it. Postgres, Redis and the services stay on the compose network;
# identity, trading and ledger trust the X-User-* headers the gateway sets, so nothing but the gateway may
# reach them.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

x-go-service: &go-service
  <<: *logging
  restart: unless-stopped

x-common-env: &common-env
  LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
  OTEL_NAMESPACE: ${OTEL_NAMESPACE:-}
  OTEL_RATIO: ${OTEL_RATIO:-}

x-db-env: &db-env
  <<: *common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: ${POSTGRES_USER:-otc}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REDIS_ADDR: redis:6379

services:
  postgres:
    <<: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary init server answers on the socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d ledger']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    <<: *logging
    image: redis:8-alpine
    restart: unless-stopped
    # sessions live here: a volume keeps them across deploys
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

  ledger:
    <<: *go-service
    image: ${IMAGE_PREFIX}/ledger:${IMAGE_TAG}
    # a participant on this host is reachable as host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      <<: *db-env
      OTEL_SERVICE_NAME: ledger
      HTTP_PORT: '8083'
      GRPC_PORT: '9083'
      POSTGRES_DB_NAME: ledger
      CANTON_URL: ${CANTON_URL:?set CANTON_URL in .env}
      CANTON_USER_ID: ${CANTON_USER_ID:-}
      OPERATOR_HINT: ${OPERATOR_HINT:-}
      HOUSE_PARTIES: ${HOUSE_PARTIES:-}
      INSTRUMENTS: ${INSTRUMENTS:-}
      FAUCET_AMOUNTS: ${FAUCET_AMOUNTS:-}
      ACTION_TTL: ${ACTION_TTL:-}
    # an in-flight settle or cancel is one ledger call of up to 30 s
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8083/ready']
      interval: 3s
      timeout: 3s
      retries: 60

  identity:
    <<: *go-service
    image: ${IMAGE_PREFIX}/identity:${IMAGE_TAG}
    environment:
      <<: *db-env
      OTEL_SERVICE_NAME: identity
      HTTP_PORT: '8081'
      GRPC_PORT: '9081'
      POSTGRES_DB_NAME: identity
      LEDGER_GRPC_ADDR: ledger:9083
      HOUSE_MAKERS: ${HOUSE_MAKERS:?set HOUSE_MAKERS in .env}
      SESSION_TTL: ${SESSION_TTL:-}
      # the browser reaches the desk over HTTPS only
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8081/ready']

  trading:
    <<: *go-service
    image: ${IMAGE_PREFIX}/trading:${IMAGE_TAG}
    environment:
      <<: *db-env
      OTEL_SERVICE_NAME: trading
      HTTP_PORT: '8082'
      POSTGRES_DB_NAME: trading
      LEDGER_GRPC_ADDR: ledger:9083
      IDENTITY_GRPC_ADDR: identity:9081
      FEE_BPS: ${FEE_BPS:-}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-}
      SETTLE_TIMEOUT: ${SETTLE_TIMEOUT:-}
    # the worker finishes an in-flight settlement (one ledger call of up to 30 s) before exiting
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8082/ready']

  gateway:
    <<: *go-service
    image: ${IMAGE_PREFIX}/gateway:${IMAGE_TAG}
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: gateway
      HTTP_PORT: '8080'
      REDIS_ADDR: redis:6379
      IDENTITY_GRPC_ADDR: identity:9081
      IDENTITY_URL: http://identity:8081
      TRADING_URL: http://trading:8082
      LEDGER_URL: http://ledger:8083
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/ready']

  maker-bot:
    <<: *go-service
    image: ${IMAGE_PREFIX}/maker-bot:${IMAGE_TAG}
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: maker-bot
      GATEWAY_URL: http://gateway:8080
      MAKER_KEYS: ${MAKER_KEYS:?set MAKER_KEYS in .env}
      PRICES_USD: ${PRICES_USD:-}
      QUOTE_TTL: ${QUOTE_TTL:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-}
    depends_on:
      gateway:
        condition: service_healthy

  web:
    <<: *logging
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:80'
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
  redis-data:
