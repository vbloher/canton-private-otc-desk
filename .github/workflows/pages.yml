name: Pages

# Deploys the web app to GitHub Pages. Pages serves static files only, so the app talks to a
# gateway hosted elsewhere: set the repository variable API_URL to its origin
# (e.g. https://desk.example.com) and add this site's origin to the gateway's CORS_ORIGINS.
# Without API_URL the site deploys anyway and explains that no desk is connected.
# One-time setup: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'api/http/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # base_path is /<repo> for a project site and empty for a custom domain or <owner>.github.io
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build for Pages
        run: pnpm build
        env:
          VITE_DEPLOY: pages
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_API_URL: ${{ vars.API_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
