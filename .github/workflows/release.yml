name: Release

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    name: Target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      network: ${{ steps.target.outputs.network }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - id: target
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev) environment=dev network=devnet tag="sha-${GITHUB_SHA::7}" ;;
            refs/tags/v*) environment=prod network=mainnet tag="${GITHUB_REF_NAME#v}" ;;
            *) echo "::error::releases run from the dev branch or a v* tag, not $GITHUB_REF"; exit 1 ;;
          esac
          {
            echo "environment=$environment"
            echo "network=$network"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Image (${{ matrix.image }})
    needs: [target, ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, identity, trading, ledger, maker-bot, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.target.outputs.tag }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'web' && 'web' || '.' }}
          build-args: ${{ matrix.image != 'web' && format('SERVICE={0}', matrix.image) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy (${{ needs.target.outputs.environment }})
    needs: [target, image]
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_DIR: otc-desk-${{ needs.target.outputs.environment }}
      IMAGE_TAG: ${{ needs.target.outputs.tag }}
      NETWORK: ${{ needs.target.outputs.network }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - uses: actions/checkout@v7

      - name: Render
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p out/postgres
          envsubst '${IMAGE_PREFIX} ${IMAGE_TAG}' < deploy/docker-compose.yml > out/docker-compose.yml
          cp "deploy/.env.$NETWORK.example" out/.env.example
          cp deploy/postgres/init.sql out/postgres/init.sql

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            BatchMode yes
          EOF

      - name: Upload
        run: tar -C out -cf - . | ssh server "mkdir -p '$DEPLOY_DIR' && tar -C '$DEPLOY_DIR' -xf -"

      - name: Start
        run: |
          ssh server "cd '$DEPLOY_DIR' && NETWORK='$NETWORK' sh -s" <<'EOF'
          set -eu
          if [ ! -f .env ]; then
            echo "::error::$(pwd)/.env is missing: copy .env.example there, fill it in, then re-run this job"
            exit 1
          fi
          if ! grep -qx "CANTON_NETWORK=$NETWORK" .env; then
            echo "::error::$(pwd)/.env must set CANTON_NETWORK=$NETWORK for this environment"
            exit 1
          fi
          bot=$(docker compose config --services | grep -x maker-bot || true)
          if [ "$NETWORK" = mainnet ] && [ -n "$bot" ]; then
            echo "::error::the maker bot must not run on mainnet: drop demo from COMPOSE_PROFILES in $(pwd)/.env"
            exit 1
          fi
          docker compose pull --quiet
          docker compose up -d --wait --wait-timeout 600 --remove-orphans
          if [ -z "$bot" ]; then
            docker compose --profile demo rm -sf maker-bot
          fi
          docker compose ps
          EOF

      - name: Prune
        run: ssh server "docker image prune -af --filter 'label=org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY'"
