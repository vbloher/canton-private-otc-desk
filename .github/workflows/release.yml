name: Release images

# Publishes one multi-arch image per service plus the web app to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>/<image>:edge, :sha-<short>   on every push to master
#   ghcr.io/<owner>/<repo>/<image>:1.2.3, :1.2, :latest on a v1.2.3 tag
# edge follows master whether or not CI passed on that commit; tags are the stable channel.
# Each image is linked to this repository and takes its visibility (public here).

on:
  push:
    branches: [master]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, identity, trading, ledger, maker-bot, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'web' && 'web' || '.' }}
          build-args: ${{ matrix.image != 'web' && format('SERVICE={0}', matrix.image) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
