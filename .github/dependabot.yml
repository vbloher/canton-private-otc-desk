version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    labels: [dependencies]

updates:
  - package-ecosystem: gomod
    directories: [/, /maker-bot]
    patterns: ['*']
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /web
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directories: [/, /web, /maker-bot]
    patterns: ['*']
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: golang
        update-types: ['version-update:semver-minor']
      - dependency-name: nginx
        update-types: ['version-update:semver-minor']

  - package-ecosystem: docker-compose
    directories: [/, /deploy, /deploy/observability]
    patterns: ['*']
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
